<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="DVL3LZx0czq7W4g2Dtdkv46GpL2S79M4eeXYdEb7onk" />
    <title>Growing Minds Academy AI Quiz System</title>
    <meta name="description" content="School assessment platform with AI quiz creation, offline assessments, automated marking, controlled result release, and learning analytics." />
    <meta property="og:title" content="Growing Minds Academy AI Quiz System" />
    <meta property="og:description" content="School assessment platform with AI quiz creation, offline assessments, automated marking, controlled result release, and learning analytics." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Plus Jakarta Sans is self-hosted (public/fonts) so the login screen renders
         identically offline in the PWA with no third-party font request. -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body class="bg-[#F5F8FC] text-[#0F172A] antialiased selection:bg-[#6CABDD]/20 selection:text-[#1C2C5B]">
    <div id="root"></div>
    
    <!-- Security: Disable inspect element and dev tools -->
    <script>
      // Disable right-click
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      
      // Disable F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+S
      document.addEventListener('keydown', (e) => {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && e.key === 'I') ||
          (e.ctrlKey && e.shiftKey && e.key === 'J') ||
          (e.ctrlKey && e.shiftKey && e.key === 'C') ||
          (e.ctrlKey && e.key === 'u') ||
          (e.ctrlKey && e.key === 's')
        ) {
          e.preventDefault();
          return false;
        }
      });
      
      // Detect if DevTools is open
      let devtoolsOpen = false;
      const detectDevTools = () => {
        const threshold = 160;
        const widthThreshold = window.outerWidth - window.innerWidth > threshold;
        const heightThreshold = window.outerHeight - window.innerHeight > threshold;
        
        if (widthThreshold || heightThreshold) {
          if (!devtoolsOpen) {
            devtoolsOpen = true;
            document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;background:#0F172A;color:white;text-align:center;padding:2rem;"><div><h1 style="font-size:2rem;margin-bottom:1rem;">🚫 Access Restricted</h1><p>Developer tools are not permitted on this platform.</p></div></div>';
          }
        } else {
          devtoolsOpen = false;
        }
      };
      
      // Check every 500ms
      setInterval(detectDevTools, 500);
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
