name: CI

# Runs on every push to main and on every pull request, so a reviewer sees a
# green check instead of having to trust that lint, tests and the build pass.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The secret scan below walks every blob in history, not just the
          # working tree, so it needs the full clone rather than the default
          # single-commit one.
          fetch-depth: 0

      # 20 is the minimum declared in package.json "engines".
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      # Runs all 45 tests and prints a coverage summary. The suites pin their own
      # configuration (empty Supabase URL/key, empty AI keys, a throwaway JWT
      # secret) before importing the server, so CI needs no repository secrets
      # and the fail-closed paths are the ones exercised.
      - name: Run tests with coverage
        run: npm run test:coverage

      # Fails the job if anything credential-shaped appears anywhere in the
      # repository's history. Needs the fetch-depth: 0 above.
      - name: Scan Git history for secrets
        run: node scripts/secret-scan.mjs

      - name: Production build
        run: npm run build
